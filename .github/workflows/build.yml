name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # manual test builds from the Actions tab (no release)

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: python -m pytest -q tests

  # ── Windows build ────────────────────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Official llama.cpp build: CPU variants chosen at runtime + Vulkan for integrated GPUs.
      # No compiling needed (v1 compiled llama-cpp-python with SSE2 only, which was slow).
      - name: Fetch llama-server
        run: python scripts/fetch_llama_server.py

      - name: Build with PyInstaller
        run: pyinstaller student_ai.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist\StudentAI" -DestinationPath "StudentAI2-Windows.zip" -Force

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: StudentAI2-Windows
          path: StudentAI2-Windows.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: StudentAI2-Windows.zip
          generate_release_notes: true

  # ── macOS build (Apple Silicon) ──────────────────────────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch llama-server (Metal)
        run: python scripts/fetch_llama_server.py

      - name: Build with PyInstaller
        run: pyinstaller student_ai.spec

      - name: Zip
        run: cd dist && ditto -c -k --keepParent StudentAI.app ../StudentAI2-macOS.zip

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: StudentAI2-macOS
          path: StudentAI2-macOS.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: StudentAI2-macOS.zip
